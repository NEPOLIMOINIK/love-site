<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мини-тест &lt;3</title>
    <style>
        html, body {
            margin: 0;
            min-height: 100vh;
        }

        body {
            background-color: #3b0000;
            font-family: Georgia, "Times New Roman", serif;
            color: #ffd9d9;
            padding: 40px 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

        /* ===== ФОНОВЫЕ СЕРДЕЧКИ ===== */
        .hearts-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .heart {
            position: absolute;
            bottom: -60px;
            line-height: 1;
            color: #3b0000;
            user-select: none;
            will-change: transform, color, opacity;
            animation-name: floatUp;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) translateX(0) scale(0.8) rotate(0deg);
                color: #3b0000;
                opacity: 0;
            }
            10% { opacity: 0.85; }
            35% { color: #8B0000; }
            65% { color: #d40000; }
            100% {
                transform: translateY(-115vh) translateX(var(--drift, 0px)) scale(1.25) rotate(18deg);
                color: #ff1a1a;
                opacity: 0;
            }
        }

        /* ===== БОЛЬШОЕ ФОНОВОЕ СЕРДЦЕ ===== */
        .bg-heart {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70vmin;
            height: 70vmin;
            max-width: 800px;
            max-height: 800px;
            z-index: 0;
            pointer-events: none;
            user-select: none;
            opacity: 0.3;
            animation: heartPulse 2.5s ease-in-out infinite;
        }

        .bg-heart svg {
            width: 100%;
            height: 100%;
            display: block;
            filter: drop-shadow(0 0 40px rgba(255, 0, 0, 0.9));
        }

        .bg-heart .heart-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -45%);
            font-family: Consolas, "Courier New", monospace;
            font-size: 7vmin;
            font-weight: bold;
            letter-spacing: 5px;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.9),
                         0 0 40px rgba(255, 0, 0, 1);
            white-space: nowrap;
        }

        @keyframes heartPulse {
            0%   { transform: translate(-50%, -50%) scale(1); }
            50%  { transform: translate(-50%, -50%) scale(1.08); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        /* ===== КОНТЕНТ ===== */
        h1, .quiz, .buttons {
            position: relative;
            z-index: 2;
        }

        h1 {
            font-family: Consolas, "Courier New", monospace;
            font-size: 38px;
            letter-spacing: 3px;
            text-align: center;
            margin: 0 0 30px;

            background: linear-gradient(135deg, #ff0000 0%, #ff8080 50%, #ffffff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;

            filter: drop-shadow(0 0 15px rgba(255, 0, 0, 0.7));
        }

        /* Карточка теста */
        .quiz {
            max-width: 650px;
            width: 100%;
            background: rgba(0, 0, 0, 0.55);
            border: 2px solid #ff4d4d;
            border-radius: 20px;
            padding: 30px 25px;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.6);
            backdrop-filter: blur(4px);
        }

        .question {
            margin-bottom: 30px;
        }

        .question:last-of-type {
            margin-bottom: 20px;
        }

        .q-title {
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 14px;
            color: #ffffff;
            text-shadow: 0 0 6px rgba(255, 0, 0, 0.6);
        }

        /* Варианты ответа */
        .option {
            display: block;
            padding: 12px 16px;
            margin-bottom: 10px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 100, 100, 0.4);
            cursor: pointer;
            transition: background 0.2s, border 0.2s, transform 0.15s;
            font-size: 17px;
        }

        .option:hover {
            background: rgba(255, 0, 0, 0.15);
            border-color: #ff4d4d;
            transform: translateX(4px);
        }

        .option input {
            margin-right: 10px;
            accent-color: #ff0000;
            transform: scale(1.2);
            vertical-align: middle;
        }

        /* Текстовое поле */
        .text-input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 12px;
            border: 1px solid rgba(255, 100, 100, 0.5);
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            font-family: inherit;
            font-size: 17px;
            box-sizing: border-box;
            resize: vertical;
            min-height: 90px;
        }

        .text-input:focus {
            outline: none;
            border-color: #ff4d4d;
            box-shadow: 0 0 12px rgba(255, 0, 0, 0.6);
        }

        .text-input::placeholder {
            color: rgba(255, 217, 217, 0.5);
        }

        /* Кнопка Отправить */
        .send-btn {
            display: block;
            width: 100%;
            margin-top: 10px;
            padding: 16px;
            border-radius: 50px;
            border: 2px solid #ffffff;
            background: radial-gradient(circle at 30% 30%, #ff4d4d, #8B0000 70%);
            color: #ffffff;
            font-family: Consolas, "Courier New", monospace;
            font-size: 19px;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.9);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .send-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 0 35px rgba(255, 255, 255, 1);
        }

        .send-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Сообщение после отправки */
        .result-msg {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            font-size: 18px;
            background: rgba(0, 200, 0, 0.2);
            border: 1px solid #4dff4d;
            color: #ffffff;
            display: none;
        }

        .result-msg.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Кнопки навигации */
        .buttons {
            display: flex;
            gap: 20px;
            margin-top: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            display: inline-block;
            padding: 15px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-family: Consolas, "Courier New", monospace;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #ffffff;
            border: 2px solid #ffffff;
            background: radial-gradient(circle at 30% 30%, #ff4d4d, #8B0000 70%);
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.9);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.9);
        }

        /* Адаптация */
        @media (max-width: 600px) {
            body { padding: 25px 15px; }
            h1 { font-size: 26px; letter-spacing: 2px; margin-bottom: 20px; }
            .quiz { padding: 20px 15px; }
            .q-title { font-size: 17px; }
            .option { font-size: 15px; padding: 10px 12px; }
            .text-input { font-size: 15px; }
            .send-btn { font-size: 17px; padding: 14px; }
            .btn { font-size: 16px; padding: 12px 30px; }
            .bg-heart .heart-text { font-size: 10vmin; letter-spacing: 3px; }
            .heart { font-size: 22px; }
        }
    </style>
</head>
<body>

    <!-- ФОНОВЫЕ СЕРДЕЧКИ -->
    <div class="hearts-bg" id="heartsBg"></div>

    <!-- БОЛЬШОЕ ФОНОВОЕ СЕРДЦЕ -->
    <div class="bg-heart">
        <svg viewBox="0 0 32 29.6" xmlns="http://www.w3.org/2000/svg">
            <path d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,9.5,11.9,16,21.2
                     c6.1-9.3,16-12.1,16-21.2C32,3.8,28.2,0,23.6,0z"
                  fill="#ff0000" />
        </svg>
        <div class="heart-text">ЛЮБЛЮ</div>
    </div>

    <h1>Мини-тест для тебя &lt;3</h1>

    <form class="quiz" id="quizForm">

        <div class="question">
            <div class="q-title">1. Ты меня любишь?</div>
            <label class="option"><input type="radio" name="q1" value="Да"> Да</label>
            <label class="option"><input type="radio" name="q1" value="Нет"> Нет</label>
            <label class="option"><input type="radio" name="q1" value="Нет конечно"> Нет конечно</label>
            <label class="option"><input type="radio" name="q1" value="Конечно люблю :3"> Конечно люблю :3</label>
        </div>

        <div class="question">
            <div class="q-title">2. Как думаешь у нас получиться ли жить в месте однажды?</div>
            <label class="option"><input type="radio" name="q2" value="Да"> Да</label>
            <label class="option"><input type="radio" name="q2" value="Нет!!!"> Нет!!!</label>
            <label class="option"><input type="radio" name="q2" value="Я не готова к такому"> Я не готова к такому</label>
            <label class="option"><input type="radio" name="q2" value="Не знаю"> Не знаю</label>
        </div>

        <div class="question">
            <div class="q-title">3. Напиши почему я тебе понравился и почему ты меня любишь? о.о</div>
            <textarea class="text-input" name="q3" placeholder="Твоё сообщение..."></textarea>
        </div>

        <button type="submit" class="send-btn" id="sendBtn">Отправить 💌</button>
        <div class="result-msg" id="resultMsg">Спасибо! Ответы отправлены 💖</div>

    </form>

    <div class="buttons">
        <a class="btn" href="page3.html">← Назад</a>
        <a class="btn next-btn" href="page5.html">Дальше)</a>
    </div>

    <script>
        /* ============================================================
           ⬇️⬇️⬇️  ВПИШИ СВОИ ДАННЫЕ ЗДЕСЬ  ⬇️⬇️⬇️
           ============================================================ */

        // Токен бота (получить у @BotFather через /newbot или /token)
        const BOT_TOKEN = "8861077536:AAEI12k5A6HRQVZmbjBvxzoT_tBBnKDbW-U";

        // Твой chat_id (узнать через getUpdates после того, как напишешь боту)
        const CHAT_ID = "8626966841";

        /* ============================================================
           ⬆️⬆️⬆️  БОЛЬШЕ НИЧЕГО МЕНЯТЬ НЕ НУЖНО  ⬆️⬆️⬆️
           ============================================================ */

        const form = document.getElementById("quizForm");
        const sendBtn = document.getElementById("sendBtn");
        const resultMsg = document.getElementById("resultMsg");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            // Проверка, что данные вписаны
            if (BOT_TOKEN.includes("ВСТАВЬ") || CHAT_ID.includes("ВСТАВЬ")) {
                resultMsg.textContent = "⚠️ Впиши токен и chat_id в код!";
                resultMsg.style.background = "rgba(255, 200, 0, 0.2)";
                resultMsg.style.borderColor = "#ffcc00";
                resultMsg.classList.add("show");
                return;
            }

            sendBtn.disabled = true;
            sendBtn.textContent = "Отправляю...";

            // Собираем ответы
            const data = new FormData(form);
            const answers = {
                q1: data.get("q1") || "— не выбрано —",
                q2: data.get("q2") || "— не выбрано —",
                q3: (data.get("q3") || "").trim() || "— пусто —"
            };

            // Формируем красивое сообщение
            const text =
`💌 Новые ответы на мини-тест!

1. Ты меня любишь? — ${answers.q1}
2. Будем ли жить вместе? — ${answers.q2}
3. Почему я тебе понравился:
${answers.q3}

⏰ ${new Date().toLocaleString("ru-RU")}`;

            // Отправка в Telegram
            try {
                const res = await fetch(
                    `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,
                    {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            chat_id: CHAT_ID,
                            text: text
                        })
                    }
                );

                const json = await res.json();

                if (json.ok) {
                    resultMsg.textContent = "Спасибо! Люблю тебя любимая!";
                    resultMsg.style.background = "rgba(0, 200, 0, 0.2)";
                    resultMsg.style.borderColor = "#4dff4d";
                    resultMsg.classList.add("show");
                    form.reset();
                } else {
                    throw new Error(json.description || "Ошибка Telegram API");
                }
            } catch (err) {
                resultMsg.textContent = "Ой, не получилось отправить 😢 Попробуй ещё раз.";
                resultMsg.style.background = "rgba(255, 0, 0, 0.25)";
                resultMsg.style.borderColor = "#ff4d4d";
                resultMsg.classList.add("show");
                console.error("Ошибка отправки:", err);
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = "Отправить 💌";
            }
        });
    </script>

    <!-- Скрипт для генерации фоновых сердечек -->
    <script>
        (function () {
            const container = document.getElementById('heartsBg');
            const HEART_COUNT = 30;
            const symbols = ['❤', '♥', '❥', '❣'];

            function random(min, max) {
                return Math.random() * (max - min) + min;
            }

            function createHeart() {
                const heart = document.createElement('span');
                heart.className = 'heart';
                heart.textContent = symbols[Math.floor(Math.random() * symbols.length)];
                heart.style.left = random(0, 100) + 'vw';

                const duration = random(8, 18);
                heart.style.animationDuration = duration + 's';
                heart.style.animationDelay = random(0, duration) + 's';
                heart.style.setProperty('--drift', random(-100, 100) + 'px');
                heart.style.fontSize = random(18, 42) + 'px';

                container.appendChild(heart);
            }

            for (let i = 0; i < HEART_COUNT; i++) {
                createHeart();
            }
        })();
    </script>

</body>
</html>
