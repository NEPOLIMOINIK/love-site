<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>С Новым годом, любимая &lt;3</title>
    <style>
        html, body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
        }

        /* Фон сайта — тёмно-красный */
        body {
            background-color: #3b0000;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            opacity: 0;
            animation: pageFadeIn 1s ease forwards;
        }

        @keyframes pageFadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        body.fade-out {
            animation: pageFadeOut 0.6s ease forwards;
        }

        @keyframes pageFadeOut {
            from { opacity: 1; transform: scale(1); }
            to   { opacity: 0; transform: scale(1.05); }
        }

        /* Контейнер для мерцающих сердец на фоне (САМЫЙ ЗАДНИЙ ПЛАН) */
        .hearts-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        /* Огромное мерцающее сердце */
        .big-heart {
            position: absolute;
            color: rgba(255, 40, 40, 0.25);
            font-size: 220px;
            line-height: 1;
            user-select: none;
            pointer-events: none;
            text-shadow: 0 0 40px rgba(255, 0, 0, 0.6);
            animation: flicker 3s infinite alternate ease-in-out;
            transform-origin: center;
            white-space: nowrap;
        }

        /* Разные задержки и длительности для естественного мерцания */
        .big-heart:nth-child(1)  { top: 5%;  left: 2%;  font-size: 260px; animation-duration: 2.4s; animation-delay: 0s;   }
        .big-heart:nth-child(2)  { top: 60%; left: 70%; font-size: 300px; animation-duration: 3.2s; animation-delay: 0.5s; }
        .big-heart:nth-child(3)  { top: 15%; left: 75%; font-size: 200px; animation-duration: 2.8s; animation-delay: 1s;   }
        .big-heart:nth-child(4)  { top: 70%; left: 10%; font-size: 280px; animation-duration: 3.6s; animation-delay: 0.2s; }
        .big-heart:nth-child(5)  { top: 40%; left: 45%; font-size: 340px; animation-duration: 4s;   animation-delay: 0.8s; }
        .big-heart:nth-child(6)  { top: 80%; left: 55%; font-size: 240px; animation-duration: 2.6s; animation-delay: 1.4s; }
        .big-heart:nth-child(7)  { top: 30%; left: 20%; font-size: 220px; animation-duration: 3.4s; animation-delay: 0.3s; }
        .big-heart:nth-child(8)  { top: 10%; left: 40%; font-size: 270px; animation-duration: 3s;   animation-delay: 1.8s; }

        /* Анимация мерцания: прозрачность + лёгкое масштабирование */
        @keyframes flicker {
            0% {
                opacity: 0.15;
                transform: scale(0.9) rotate(-5deg);
            }
            30% {
                opacity: 0.7;
                transform: scale(1.1) rotate(3deg);
            }
            60% {
                opacity: 0.3;
                transform: scale(0.95) rotate(-2deg);
            }
            100% {
                opacity: 0.85;
                transform: scale(1.15) rotate(5deg);
            }
        }

        /* Надпись — САМЫЙ ПЕРЕДНИЙ ПЛАН */
        .bg-text {
            position: relative;
            z-index: 10;
            font-family: Consolas, "Courier New", monospace;
            font-size: 64px;
            font-weight: bold;
            text-align: center;
            letter-spacing: 3px;
            padding: 0 20px;
            pointer-events: none;
            user-select: none;

            background: linear-gradient(135deg, #ff0000 0%, #ff8080 50%, #ffffff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;

            filter: drop-shadow(0 0 15px rgba(255, 0, 0, 0.9))
                    drop-shadow(0 0 30px rgba(255, 0, 0, 0.6));

            animation: textGlow 2.5s ease-in-out infinite alternate;
        }

        /* Курсор-палочка, как у печатной машинки */
        .bg-text::after {
            content: "|";
            -webkit-text-fill-color: #ffffff;
            color: #ffffff;
            margin-left: 4px;
            animation: blink 0.8s step-end infinite;
            opacity: 0;
        }

        .bg-text.typing::after {
            opacity: 1;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50%      { opacity: 0; }
        }

        /* Мягкое дыхание свечения текста */
        @keyframes textGlow {
            0% {
                filter: drop-shadow(0 0 12px rgba(255, 0, 0, 0.8))
                        drop-shadow(0 0 25px rgba(255, 0, 0, 0.5));
            }
            100% {
                filter: drop-shadow(0 0 25px rgba(255, 80, 80, 1))
                        drop-shadow(0 0 50px rgba(255, 0, 0, 0.8));
            }
        }

        /* Кружок «Нажми» внизу справа */
        .round-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;

            text-decoration: none;
            font-family: Consolas, "Courier New", monospace;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1px;
            color: #ffffff;

            background: radial-gradient(circle at 30% 30%, #ff4d4d, #8B0000 70%);
            border: 2px solid #ffffff;

            box-shadow: 0 0 15px rgba(255, 0, 0, 0.9),
                        0 0 30px rgba(255, 0, 0, 0.5);

            z-index: 20;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: pulse 1.8s infinite;

            opacity: 0;
            animation: pulse 1.8s infinite, btnAppear 0.6s ease 3.5s forwards;
        }

        @keyframes btnAppear {
            from { opacity: 0; transform: scale(0.6); }
            to   { opacity: 1; transform: scale(1); }
        }

        .round-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.9),
                        0 0 45px rgba(255, 0, 0, 0.9);
        }

        /* Пульсация кружка */
        @keyframes pulse {
            0%   { box-shadow: 0 0 15px rgba(255,0,0,0.9), 0 0 30px rgba(255,0,0,0.5); }
            50%  { box-shadow: 0 0 25px rgba(255,255,255,0.9), 0 0 45px rgba(255,0,0,0.9); }
            100% { box-shadow: 0 0 15px rgba(255,0,0,0.9), 0 0 30px rgba(255,0,0,0.5); }
        }

        /* Адаптация под телефоны */
        @media (max-width: 700px) {
            .bg-text {
                font-size: 32px;
                letter-spacing: 2px;
            }
            .big-heart {
                font-size: 140px !important;
            }
            .round-btn {
                width: 70px;
                height: 70px;
                font-size: 13px;
                bottom: 18px;
                right: 18px;
            }
        }
    </style>
</head>
<body>

    <!-- САМЫЙ ЗАДНИЙ ПЛАН: огромные мерцающие сердца -->
    <div class="hearts-bg">
        <div class="big-heart">❤</div>
        <div class="big-heart">❤</div>
        <div class="big-heart">❤</div>
        <div class="big-heart">❤</div>
        <div class="big-heart">❤</div>
        <div class="big-heart">❤</div>
        <div class="big-heart">❤</div>
        <div class="big-heart">❤</div>
    </div>

    <!-- САМЫЙ ПЕРЕДНИЙ ПЛАН: надпись с эффектом печатной машинки -->
    <div class="bg-text" id="typedText"></div>

    <!-- Кружок внизу справа → переход на вторую страницу -->
    <a class="round-btn" href="page2.html" id="nextBtn">Нажми</a>

    <script>
        (function () {
            const textEl = document.getElementById('typedText');
            const fullText = 'С новым годом любимая, люблю тебя <3';
            const typingSpeed = 80; // мс на символ

            let i = 0;
            textEl.classList.add('typing');

            function typeChar() {
                if (i < fullText.length) {
                    // Если символ '<' — вставляем как текст, чтобы не ломать HTML
                    if (fullText[i] === '<') {
                        textEl.innerHTML += '&lt;';
                    } else if (fullText[i] === '>') {
                        textEl.innerHTML += '&gt;';
                    } else {
                        textEl.textContent += fullText[i];
                    }
                    i++;
                    setTimeout(typeChar, typingSpeed);
                } else {
                    // После окончания печати убираем курсор
                    setTimeout(function () {
                        textEl.classList.remove('typing');
                    }, 800);
                }
            }

            // Небольшая задержка перед началом печати
            setTimeout(typeChar, 500);

            // Плавный переход на следующую страницу
            const nextBtn = document.getElementById('nextBtn');
            nextBtn.addEventListener('click', function (e) {
                e.preventDefault();
                const target = this.getAttribute('href');
                document.body.classList.add('fade-out');
                setTimeout(function () {
                    window.location.href = target;
                }, 600);
            });
        })();
    </script>

</body>
</html>
