<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>С Новым годом, ягодка &lt;3</title>
    <style>
        html, body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
        }

        /* Фон сайта — тёмно-красный */
        body {
            background-color: #3b0000;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Контейнер для мерцающих сердец на фоне (САМЫЙ ЗАДНИЙ ПЛАН) */
        .hearts-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        /* Огромное мерцающее сердце */
        .big-heart {
            position: absolute;
            color: rgba(255, 40, 40, 0.25);
            font-size: 220px;
            line-height: 1;
            user-select: none;
            pointer-events: none;
            text-shadow: 0 0 40px rgba(255, 0, 0, 0.6);
            animation: flicker 3s infinite alternate ease-in-out;
            transform-origin: center;
            white-space: nowrap;
        }

        /* Разные задержки и длительности для естественного мерцания */
        .big-heart:nth-child(1)  { top: 5%;  left: 2%;  font-size: 260px; animation-duration: 2.4s; animation-delay: 0s;   }
        .big-heart:nth-child(2)  { top: 60%; left: 70%; font-size: 300px; animation-duration: 3.2s; animation-delay: 0.5s; }
        .big-heart:nth-child(3)  { top: 15%; left: 75%; font-size: 200px; animation-duration: 2.8s; animation-delay: 1s;   }
        .big-heart:nth-child(4)  { top: 70%; left: 10%; font-size: 280px; animation-duration: 3.6s; animation-delay: 0.2s; }
        .big-heart:nth-child(5)  { top: 40%; left: 45%; font-size: 340px; animation-duration: 4s;   animation-delay: 0.8s; }
        .big-heart:nth-child(6)  { top: 80%; left: 55%; font-size: 240px; animation-duration: 2.6s; animation-delay: 1.4s; }
        .big-heart:nth-child(7)  { top: 30%; left: 20%; font-size: 220px; animation-duration: 3.4s; animation-delay: 0.3s; }
        .big-heart:nth-child(8)  { top: 10%; left: 40%; font-size: 270px; animation-duration: 3s;   animation-delay: 1.8s; }

        /* Анимация мерцания: прозрачность + лёгкое масштабирование */
        @keyframes flicker {
            0% {
                opacity: 0.15;
                transform: scale(0.9) rotate(-5deg);
            }
            30% {
                opacity: 0.7;
                transform: scale(1.1) rotate(3deg);
            }
            60% {
                opacity: 0.3;
                transform: scale(0.95) rotate(-2deg);
            }
            100% {
                opacity: 0.85;
                transform: scale(1.15) rotate(5deg);
            }
        }

        /* Сердце из символов — средний план */
        pre {
            position: relative;
            z-index: 2;
            font-family: Consolas, "Courier New", monospace;
            font-size: 18px;
            line-height: 1.1;
            letter-spacing: 0;
            color: red;
            margin: 0;
            text-shadow: 0 0 8px rgba(255, 0, 0, 0.8),
                         0 0 20px rgba(255, 0, 0, 0.5);
        }

        /* Надпись «С новым годом ягодка <3» — САМЫЙ ПЕРЕДНИЙ ПЛАН */
        .bg-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: Consolas, "Courier New", monospace;
            font-size: 64px;
            font-weight: bold;
            text-align: center;
            white-space: nowrap;
            letter-spacing: 4px;
            pointer-events: none;
            user-select: none;
            z-index: 10;

            background: linear-gradient(135deg, #ff0000 0%, #ff8080 50%, #ffffff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;

            filter: drop-shadow(0 0 15px rgba(255, 0, 0, 0.9))
                    drop-shadow(0 0 30px rgba(255, 0, 0, 0.6));
        }

        /* Кружок «Нажми» внизу справа */
        .round-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;

            text-decoration: none;
            font-family: Consolas, "Courier New", monospace;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1px;
            color: #ffffff;

            background: radial-gradient(circle at 30% 30%, #ff4d4d, #8B0000 70%);
            border: 2px solid #ffffff;

            box-shadow: 0 0 15px rgba(255, 0, 0, 0.9),
                        0 0 30px rgba(255, 0, 0, 0.5);

            z-index: 20;
            transition: transform 0.2s, box-shadow 0.2s;
            animation: pulse 1.8s infinite;
        }

        .round-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.9),
                        0 0 45px rgba(255, 0, 0, 0.9);
        }

        /* Пульсация кружка */
        @keyframes pulse {
            0%   { box-shadow: 0 0 15px rgba(255,0,0,0.9), 0 0 30px rgba(255,0,0,0.5); }
            50%  { box-shadow: 0 0 25px rgba(255,255,255,0.9), 0 0 45px rgba(255,0,0,0.9); }
            100% { box-shadow: 0 0 15px rgba(255,0,0,0.9), 0 0 30px rgba(255,0,0,0.5); }
        }
    </style>
</head>
<body>

    <!-- САМЫЙ ЗАДНИЙ ПЛАН: огромные мерцающие сердца -->
    <div class="hearts-bg">
        <div class="big-heart">❤</div>
        <div class="big-heart">❤</div>
        <div class="big-heart">❤</div>
        <div class="big-heart">❤</div>
        <div class="big-heart">❤</div>
        <div class="big-heart">❤</div>
        <div class="big-heart">❤</div>
        <div class="big-heart">❤</div>
    </div>



    <!-- САМЫЙ ПЕРЕДНИЙ ПЛАН: надпись -->
    <div class="bg-text">С новым годом ягодка &lt;3</div>

    <!-- Кружок внизу справа → переход на вторую страницу -->
    <a class="round-btn" href="page2.html">Нажми</a>

</body>
</html>
